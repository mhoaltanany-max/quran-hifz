plugins {
    id "com.android.application"
}

android {
    namespace "app.rafiq.hifz"
    compileSdk 34

    defaultConfig {
        applicationId "app.rafiq.hifz"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "rafiqhifz"
            keyAlias "hifz"
            keyPassword "rafiqhifz"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
