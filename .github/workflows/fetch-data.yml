name: جلب بيانات أسباب النزول

on:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تنزيل الملفات من قرآنبيديا
        run: |
          mkdir -p data-raw/quranpedia
          cd data-raw/quranpedia
          for f in asbab-book-2919.json.gz asbab.json.gz manifest.json LICENSE.md; do
            curl -fsSL --retry 3 -A "Mozilla/5.0 (rafiq-alhifz app build)" -o "$f" "https://quranpedia.net/dumps/$f" || echo "failed: $f"
          done
          ls -la
      - name: حفظ الملفات في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-raw
          git commit -m "بيانات أسباب النزول من قرآنبيديا" || echo "no changes"
          git push
