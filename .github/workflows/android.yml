name: بناء تطبيق أندرويد

on:
  push:
    branches: [main]
    paths-ignore:
      - "data-raw/**"
      - ".github/workflows/fetch-data.yml"
      - "tools/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: نسخ ملفات التطبيق
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/

      - name: بناء ملف APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/release/app-release.apk rafiq-alhifz.apk

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: رفيق الحفظ 1.${{ github.run_number }}
          make_latest: true
          files: rafiq-alhifz.apk
          body: |
            حمّل الملف rafiq-alhifz.apk وافتحه على جوال أندرويد لتثبيت التطبيق.
